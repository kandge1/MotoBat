[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defectgen"
version = "0.1.0"
description = "Procedural battery-module geometry, defect injection and sensor models for MotoBat"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.0",
    "trimesh>=4.0",
    "pyyaml>=6.0",
    # settle.py: the rest LP, ray casts against parts, and exact booleans for
    # compressed pads and the no-overlap tests.
    "scipy>=1.11",
    "rtree>=1.0",
    "manifold3d>=2.3",
]

[project.optional-dependencies]
# Only the detection pipeline (task 1.4) needs Open3D. Keeping it out of the
# base install means a reviewer can run the generator and its tests without it.
detect = ["open3d>=0.18", "scipy>=1.11"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
defectgen = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
