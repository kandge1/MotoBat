# Known cases: dataset cases a detector change must not get worse on.
# Run before any dataset run: python defectgen/known_cases/run.py   (README.md here)
#
# Each entry is one dataset case (regenerated bit for bit from its seed) on one setup.
#   outcome  the accepted outcome. A run must do at least as well:
#              must_find: hit > partial > miss = not_covered
#              in_spec:   pass > false_reject
#              dont_care / clean: any outcome
#   fa       the most false alarms allowed (accepted count; any rise fails)
#   meas     the accepted measurement (mm or deg); a move > meas_tol warns, does not fail
#   src      why it is here: a fixlist item (F6, F7, F8, ...), "targeted" (the L0-L2
#            seed-0 sweep of every tolerance family, every level of FOD, damage and spatter,
#            the binary classes), or "clean"
#
# Adding a failure: put its reproducing cases here with the outcome they SHOULD have and the
# fixlist item, before fixing it. A fix is done when this whole file passes.
# Accepted values come from the v3 gates (13 Nov 2026, detector F7 + F8). An improvement
# prints BETTER: review it, then raise the accepted value here by hand.

