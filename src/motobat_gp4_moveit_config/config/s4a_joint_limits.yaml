# Joint limits for the GP4 at S4A, read by MoveIt's time parameterisation.
# Position and velocity limits come from the URDF (motoman_gp4_support), which match Yaskawa's
# published maximum axis speeds: S 465, L 465, U 525, R 565, B 565, T 1000 deg/s.
# ACCELERATION LIMITS ARE ASSUMED (tag A), as for the GP7 and HC10DT: a = 2 * v_max.

default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

joint_limits:
  s4a_joint_1_s:
    has_velocity_limits: true
    max_velocity: 8.1158      # 465 deg/s
    has_acceleration_limits: true
    max_acceleration: 16.2316 # A: 2 * v_max
  s4a_joint_2_l:
    has_velocity_limits: true
    max_velocity: 8.1158      # 465 deg/s
    has_acceleration_limits: true
    max_acceleration: 16.2316 # A: 2 * v_max
  s4a_joint_3_u:
    has_velocity_limits: true
    max_velocity: 9.1630      # 525 deg/s
    has_acceleration_limits: true
    max_acceleration: 18.326 # A: 2 * v_max
  s4a_joint_4_r:
    has_velocity_limits: true
    max_velocity: 9.8611      # 565 deg/s
    has_acceleration_limits: true
    max_acceleration: 19.7222 # A: 2 * v_max
  s4a_joint_5_b:
    has_velocity_limits: true
    max_velocity: 9.8611      # 565 deg/s
    has_acceleration_limits: true
    max_acceleration: 19.7222 # A: 2 * v_max
  s4a_joint_6_t:
    has_velocity_limits: true
    max_velocity: 17.4533      # 1000 deg/s
    has_acceleration_limits: true
    max_acceleration: 34.9066 # A: 2 * v_max
