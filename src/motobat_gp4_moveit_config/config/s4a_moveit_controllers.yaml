# MoveIt -> ros2_control for S4A: which action server executes plans.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - s4a_arm_controller

  s4a_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - s4a_joint_1_s
      - s4a_joint_2_l
      - s4a_joint_3_u
      - s4a_joint_4_r
      - s4a_joint_5_b
      - s4a_joint_6_t
