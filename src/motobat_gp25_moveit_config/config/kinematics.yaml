# GP25 IK: closed-form OPW (motobat_opw_kinematics_plugin), all 8 branches.
#
# No OPW file ships for the GP25; these are derived from the vendor URDF and checked against its
# forward kinematics by motobat_description/scripts/derive_opw.py gp25 (task 3.1); reach to the
# wrist centre 1729.8 mm vs the data sheet's 1730 (S). The plugin re-checks them at load.
#
# The tip is s4b_focus: the MOTOPAC-RL2D scanner's focal point, 579.5 mm past tool0 (329.5 mm
# work distance, S; flange to window 250 mm, A). OPW solves for tool0; the plugin measures the
# offset from the robot model. Offsets in radians (no deg() in ROS 2), signs integers.
welder_arm:
  kinematics_solver: motobat_opw_kinematics_plugin/OPWKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.005
  opw_kinematics_geometric_parameters:
    a1: 0.150
    a2: -0.200
    b: 0.000
    c1: 0.505
    c2: 0.760
    c3: 0.795
    c4: 0.100
  opw_kinematics_joint_offsets: [0.0, 0.0, -1.5707963267948966, 0.0, 0.0, 3.141592653589793]
  opw_kinematics_joint_sign_corrections: [1, 1, -1, -1, -1, -1]
